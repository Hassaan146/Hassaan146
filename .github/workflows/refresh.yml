name: Redraw the About card

on:
  schedule:
    # every morning, 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the art from live GitHub data
        run: python assets/build_svg.py

      - name: Commit only if a number actually changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "nothing changed, leaving history alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Redraw the About card with today's numbers"
          git push
