<text x="92.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#93a09a">Forge Mentor is a Claude Code plugin. It teaches the architectural decision, waits for your call, records it to</text>
<text x="92.0" y="135.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#93a09a">.claude/forge, and blocks code until the question is answered. 1,216 tests at full coverage.</text>
