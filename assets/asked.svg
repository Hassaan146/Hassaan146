<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="Questions asked of the agent. what is Forge Mentor. Forge Mentor is a Claude Code plugin. It teaches the architectural decision, waits for your call, records it to .claude/forge, and blocks code until the question is answered. 1,216 tests at full coverage."><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d0d0e"/><stop offset="100%" stop-color="#08080a"/></linearGradient><pattern id="mesh" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#24242a" stroke-width="1"/></pattern></defs><style>.tick{animation:tk 5s ease-in-out infinite}@keyframes tk{0%,100%{opacity:.35}18%{opacity:1}40%{opacity:.35}}.dash{stroke-dasharray:2 5;animation:d 2s linear infinite}@keyframes d{to{stroke-dashoffset:-7}}.sweep{animation:sw 9s ease-in-out infinite}@keyframes sw{0%,100%{opacity:.18}50%{opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
