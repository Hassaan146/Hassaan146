<text x="70" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" fill="#c08a3e" letter-spacing="1.9">ASK IT SOMETHING</text>
<text x="70" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5f5c57">Open an issue titled agent: and your question. A workflow answers it, writes the reply here, then closes the issue.</text>
