<text x="78.0" y="52.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.6" fill="#6ea88a" letter-spacing="1.9">ASK IT SOMETHING</text>
<text x="78.0" y="72.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5a6560">Open an issue titled agent: and your question. A workflow answers it, writes the reply here, then closes the issue.</text>
