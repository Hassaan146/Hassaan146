<text x="84" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9a958d">Forge Mentor is a Claude Code plugin. It teaches the architectural decision, waits for your call, records it to .claude/forge,</text>
<text x="84" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9a958d">and blocks code until the question is answered. 1,216 tests at full coverage.</text>
