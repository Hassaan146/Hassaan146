<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 164" width="1000" height="164" role="img" aria-label="Questions asked of the agent. what is Forge Mentor Forge Mentor is a Claude Code plugin. It teaches the architectural decision, waits for your call, records it to .claude/forge, and blocks code until the question is answered. 1,216 tests at full coverage."><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b0e0d"/><stop offset="100%" stop-color="#070908"/></linearGradient><linearGradient id="spine" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6ea88a"/><stop offset="100%" stop-color="#40705d"/></linearGradient></defs><style>.tick{animation:tk 5s ease-in-out infinite}@keyframes tk{0%,100%{opacity:.4}18%{opacity:1}42%{opacity:.4}}.dash{stroke-dasharray:2 5;animation:d 2s linear infinite}@keyframes d{to{stroke-dashoffset:-7}}.cell{animation:in .9s ease-out both}@keyframes in{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
