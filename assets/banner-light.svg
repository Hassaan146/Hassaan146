<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Muhammad Hassaan-ul-Mustafa, AI Forward-Deployed Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eaf2fb"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#0969da" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54aeff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#54aeff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#grid)"/>
  <ellipse cx="810" cy="110" rx="230" ry="150" fill="url(#glow)"/>

  <!-- accent spine -->
  <rect x="0" y="0" width="4" height="220" fill="#0969da"/>

  <!-- wordmark -->
  <text x="56" y="86" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#1f2328" letter-spacing="-0.8">Muhammad Hassaan-ul-Mustafa</text>

  <rect x="57" y="104" width="360" height="2" fill="url(#rule)"/>

  <text x="56" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16.5" font-weight="600" fill="#0969da" letter-spacing="2.4">AI FORWARD-DEPLOYED ENGINEER</text>

  <text x="56" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14.5" fill="#57606a">Building AI agents that reach production.</text>

  <text x="56" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#6e7781" letter-spacing="1.1">ARBISOFT &#183; FAST-NUCES &#183; ISLAMABAD</text>

  <!-- 7-node pipeline: the SkyElite StateGraph, drawn -->
  <g transform="translate(648,110)">
    <path d="M0 0 H46" stroke="url(#edge)" stroke-width="1.6"/>
    <path d="M46 0 H92" stroke="url(#edge)" stroke-width="1.6"/>
    <path d="M92 0 H138" stroke="url(#edge)" stroke-width="1.6"/>
    <path d="M138 0 H184" stroke="url(#edge)" stroke-width="1.6"/>
    <path d="M184 0 H230" stroke="url(#edge)" stroke-width="1.6"/>
    <path d="M230 0 H276" stroke="url(#edge)" stroke-width="1.6"/>

    <path d="M46 0 C 70 -42, 114 -42, 138 0" fill="none" stroke="#0969da" stroke-opacity=".35" stroke-width="1.3" stroke-dasharray="3 4"/>
    <path d="M138 0 C 162 42, 206 42, 230 0" fill="none" stroke="#0969da" stroke-opacity=".35" stroke-width="1.3" stroke-dasharray="3 4"/>

    <circle cx="0"   cy="0" r="8.5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <circle cx="46"  cy="0" r="8.5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <circle cx="92"  cy="0" r="8.5" fill="#54aeff" stroke="#0969da" stroke-width="2"/>
    <circle cx="138" cy="0" r="10.5" fill="#0969da" stroke="#0550ae" stroke-width="2"/>
    <circle cx="184" cy="0" r="8.5" fill="#54aeff" stroke="#0969da" stroke-width="2"/>
    <circle cx="230" cy="0" r="8.5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <circle cx="276" cy="0" r="8.5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>

    <text x="-4" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="9.5" fill="#6e7781" letter-spacing="1.4">STATEGRAPH &#183; 7 NODES</text>
  </g>
</svg>
