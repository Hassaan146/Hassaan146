<text x="3" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="var(--txt)" fill-opacity=".85">Bluetooth LE / Wi-Fi Direct / LoRa  ·  up to 7 hops  ·  no server anywhere</text>
