<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 387 74" width="387" height="74" role="img" aria-label="your phone then relay then relay then recipient">
<style>:root{--edge:#58a6ff;--txt:#7d8590;--hot:#79c0ff}@media (prefers-color-scheme:dark){:root{--txt:#8b949e}}@media (prefers-color-scheme:light){:root{--edge:#0969da;--txt:#57606a;--hot:#0550ae}}.e{stroke:var(--edge);stroke-opacity:.5;stroke-width:1.3;fill:none;stroke-dasharray:3 5;animation:d 1.4s linear infinite}@keyframes d{to{stroke-dashoffset:-8}}.b{fill:var(--edge);fill-opacity:0;stroke:var(--edge);stroke-opacity:.42;stroke-width:1.1;animation:s 5.0s ease-in-out infinite}@keyframes s{0%{stroke-opacity:.42;fill-opacity:0}7%{stroke-opacity:1;fill-opacity:.14}20%{stroke-opacity:.42;fill-opacity:0}100%{stroke-opacity:.42;fill-opacity:0}}.t{fill:var(--txt);font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11.5px;text-anchor:middle;animation:tt 5.0s ease-in-out infinite}@keyframes tt{0%{fill:var(--txt)}7%{fill:var(--hot)}20%{fill:var(--txt)}100%{fill:var(--txt)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#58a6ff" fill-opacity=".6"/></marker></defs>
<rect class="b" style="animation-delay:0.0s" x="2.0" y="20" width="95.6" height="27" rx="6"/>
<text class="t" style="animation-delay:0.0s" x="49.8" y="37.5">your phone</text>
<path class="e" d="M102.6 33.5 H118.6" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:1.25s" x="123.6" y="20" width="60.8" height="27" rx="6"/>
<text class="t" style="animation-delay:1.25s" x="154.0" y="37.5">relay</text>
<path class="e" d="M189.4 33.5 H205.4" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:2.5s" x="210.4" y="20" width="60.8" height="27" rx="6"/>
<text class="t" style="animation-delay:2.5s" x="240.8" y="37.5">relay</text>
<path class="e" d="M276.1 33.5 H292.1" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:3.75s" x="297.1" y="20" width="88.6" height="27" rx="6"/>
