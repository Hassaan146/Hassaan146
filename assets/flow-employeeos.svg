<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 74" width="544" height="74" role="img" aria-label="request then decompose then route to agents then validate then trace">
<style>:root{--edge:#58a6ff;--txt:#7d8590;--hot:#79c0ff}@media (prefers-color-scheme:dark){:root{--txt:#8b949e}}@media (prefers-color-scheme:light){:root{--edge:#0969da;--txt:#57606a;--hot:#0550ae}}.e{stroke:var(--edge);stroke-opacity:.5;stroke-width:1.3;fill:none;stroke-dasharray:3 5;animation:d 1.4s linear infinite}@keyframes d{to{stroke-dashoffset:-8}}.b{fill:var(--edge);fill-opacity:0;stroke:var(--edge);stroke-opacity:.42;stroke-width:1.1;animation:s 5.75s ease-in-out infinite}@keyframes s{0%{stroke-opacity:.42;fill-opacity:0}7%{stroke-opacity:1;fill-opacity:.14}20%{stroke-opacity:.42;fill-opacity:0}100%{stroke-opacity:.42;fill-opacity:0}}.t{fill:var(--txt);font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11.5px;text-anchor:middle;animation:tt 5.75s ease-in-out infinite}@keyframes tt{0%{fill:var(--txt)}7%{fill:var(--hot)}20%{fill:var(--txt)}100%{fill:var(--txt)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#58a6ff" fill-opacity=".6"/></marker></defs>
<rect class="b" style="animation-delay:0.0s" x="2.0" y="20" width="74.7" height="27" rx="6"/>
<text class="t" style="animation-delay:0.0s" x="39.4" y="37.5">request</text>
<path class="e" d="M81.7 33.5 H97.7" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:1.15s" x="102.7" y="20" width="88.6" height="27" rx="6"/>
<text class="t" style="animation-delay:1.15s" x="147.0" y="37.5">decompose</text>
<path class="e" d="M196.3 33.5 H212.3" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:2.3s" x="217.3" y="20" width="130.4" height="27" rx="6"/>
<text class="t" style="animation-delay:2.3s" x="282.5" y="37.5">route to agents</text>
<path class="e" d="M352.7 33.5 H368.7" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:3.45s" x="373.7" y="20" width="81.7" height="27" rx="6"/>
<text class="t" style="animation-delay:3.45s" x="414.5" y="37.5">validate</text>
<path class="e" d="M460.3 33.5 H476.3" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:4.6s" x="481.3" y="20" width="60.8" height="27" rx="6"/>
<text class="t" style="animation-delay:4.6s" x="511.7" y="37.5">trace</text>
<text x="3" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="var(--txt)" fill-opacity=".85">dependency-aware workflow, execution trace shown back to you</text>
</svg>
