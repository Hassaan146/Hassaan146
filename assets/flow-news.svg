<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 439 74" width="439" height="74" role="img" aria-label="scrape then store then rank then summarise then email">
<style>:root{--edge:#58a6ff;--txt:#7d8590;--hot:#79c0ff}@media (prefers-color-scheme:dark){:root{--txt:#8b949e}}@media (prefers-color-scheme:light){:root{--edge:#0969da;--txt:#57606a;--hot:#0550ae}}.e{stroke:var(--edge);stroke-opacity:.5;stroke-width:1.3;fill:none;stroke-dasharray:3 5;animation:d 1.4s linear infinite}@keyframes d{to{stroke-dashoffset:-8}}.b{fill:var(--edge);fill-opacity:0;stroke:var(--edge);stroke-opacity:.42;stroke-width:1.1;animation:s 5.75s ease-in-out infinite}@keyframes s{0%{stroke-opacity:.42;fill-opacity:0}7%{stroke-opacity:1;fill-opacity:.14}20%{stroke-opacity:.42;fill-opacity:0}100%{stroke-opacity:.42;fill-opacity:0}}.t{fill:var(--txt);font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11.5px;text-anchor:middle;animation:tt 5.75s ease-in-out infinite}@keyframes tt{0%{fill:var(--txt)}7%{fill:var(--hot)}20%{fill:var(--txt)}100%{fill:var(--txt)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#58a6ff" fill-opacity=".6"/></marker></defs>
<rect class="b" style="animation-delay:0.0s" x="2.0" y="20" width="67.7" height="27" rx="6"/>
<text class="t" style="animation-delay:0.0s" x="35.9" y="37.5">scrape</text>
<path class="e" d="M74.7 33.5 H90.7" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:1.15s" x="95.7" y="20" width="60.8" height="27" rx="6"/>
<text class="t" style="animation-delay:1.15s" x="126.1" y="37.5">store</text>
<path class="e" d="M161.5 33.5 H177.5" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:2.3s" x="182.5" y="20" width="53.8" height="27" rx="6"/>
<text class="t" style="animation-delay:2.3s" x="209.4" y="37.5">rank</text>
<path class="e" d="M241.4 33.5 H257.4" marker-end="url(#a)"/>
<rect class="b" style="animation-delay:3.45s" x="262.4" y="20" width="88.6" height="27" rx="6"/>
