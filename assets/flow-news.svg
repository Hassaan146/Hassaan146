<text x="3" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="var(--txt)" fill-opacity=".85">164 sites and 36 YouTube channels  ·  top 5 per user, daily</text>
