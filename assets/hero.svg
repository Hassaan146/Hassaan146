<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Muhammad Hassaan-ul-Mustafa. AI engineer, product and backend. I build AI agents and the backends they run on. Arbisoft, FAST-NUCES, Islamabad, open to remote."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141826"/><stop offset="55%" stop-color="#1d1630"/><stop offset="100%" stop-color="#0e1018"/></linearGradient><filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="46"/></filter><linearGradient id="frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity=".14"/><stop offset="100%" stop-color="#ffffff" stop-opacity=".035"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity=".38"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".1"/></linearGradient></defs><style>.dr{animation:dr 14s ease-in-out infinite}@keyframes dr{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}.dr2{animation:dr2 18s ease-in-out infinite}@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}.sh{animation:sh 7s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.5}50%{opacity:1}}.dash{stroke-dasharray:3 6;animation:d 1.7s linear infinite}@keyframes d{to{stroke-dashoffset:-9}}.orb{transform-box:view-box;transform-origin:812px 150px;animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
