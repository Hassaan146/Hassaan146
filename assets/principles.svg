<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="GUARDRAILS FIRST. Rate limiting, validation and row level security before features.. DEGRADE, DO NOT DIE. Every external call has a fallback. Clone it, it runs with zero keys.. DECIDE BEFORE CODING. The architectural choice gets made, and written down, first."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141826"/><stop offset="55%" stop-color="#1d1630"/><stop offset="100%" stop-color="#0e1018"/></linearGradient><filter id="soft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="46"/></filter><linearGradient id="frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity=".14"/><stop offset="100%" stop-color="#ffffff" stop-opacity=".035"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity=".38"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".1"/></linearGradient></defs><style>.dr{animation:dr 14s ease-in-out infinite}@keyframes dr{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-18px)}}.dr2{animation:dr2 18s ease-in-out infinite}@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}.sh{animation:sh 7s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.5}50%{opacity:1}}.dash{stroke-dasharray:3 6;animation:d 1.7s linear infinite}@keyframes d{to{stroke-dashoffset:-9}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1000" height="190" fill="url(#bg)"/>
<g filter="url(#soft)">
<circle class="dr" cx="180" cy="60" r="100" fill="#8ea2ff" opacity=".4"/>
<circle class="dr2" cx="820" cy="140" r="110" fill="#ffb572" opacity=".26"/>
</g>
<rect x="40" y="22" width="293" height="136" rx="16" fill="url(#frost)" stroke="url(#edge)" stroke-width="1.3"/>
<rect x="62" y="22" width="46" height="4" rx="2" fill="#8ea2ff"/>
<text x="62" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8ea2ff" font-weight="700">01</text>
<text x="62" y="92" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f4fb">GUARDRAILS FIRST</text>
<text x="62" y="118" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b9c0d4">Rate limiting, validation and row</text>
<text x="62" y="135" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b9c0d4">level security before features.</text>
<rect x="353" y="22" width="293" height="136" rx="16" fill="url(#frost)" stroke="url(#edge)" stroke-width="1.3"/>
<rect x="375" y="22" width="46" height="4" rx="2" fill="#5ee0c8"/>
<text x="375" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5ee0c8" font-weight="700">02</text>
<text x="375" y="92" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f4fb">DEGRADE, DO NOT DIE</text>
<text x="375" y="118" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b9c0d4">Every external call has a fallback.</text>
<text x="375" y="135" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b9c0d4">Clone it, it runs with zero keys.</text>
