<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 186" width="1000" height="186" role="img" aria-label="GUARDRAILS FIRST. Rate limiting, validation and row level security before features.. DEGRADE, DO NOT DIE. Every external call has a fallback. Clone it, it runs with zero keys.. DECIDE BEFORE CODING. The architectural choice gets made, and written down, first."><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b0618"/><stop offset="100%" stop-color="#07040f"/></linearGradient><filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gs" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.fl{animation:fl 3.4s ease-in-out infinite}@keyframes fl{0%,100%{opacity:1}47%{opacity:.68}53%{opacity:1}}.sc{animation:sc 6s linear infinite}@keyframes sc{to{transform:translateY(760px)}}.dash{stroke-dasharray:3 6;animation:d 1.5s linear infinite}@keyframes d{to{stroke-dashoffset:-9}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
