<text x="64.0" y="88.0" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#e6ebe8" font-weight="700">GUARDRAILS FIRST</text>
<text x="64.0" y="112.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#93a09a">Rate limiting, validation and row</text>
<text x="64.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#93a09a">level security before features.</text>
