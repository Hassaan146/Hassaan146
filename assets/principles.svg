<text x="688" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ffb572" font-weight="700">03</text>
<text x="688" y="92" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f4fb">DECIDE BEFORE CODING</text>
<text x="688" y="118" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b9c0d4">The architectural choice gets made,</text>
