<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 342" width="1000" height="342" role="img" aria-label="A decision gate holding until the architectural choice is made and recorded. 1,216 tests, 100% coverage, v1.28 release, MIT licence. Python 3.12 / MCP / Claude / Git"><style>.e{stroke-dasharray:2.5 4.5;animation:d 1.6s linear infinite}@keyframes d{to{stroke-dashoffset:-7}}.sg{animation:in .9s ease-out both}@keyframes in{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1000" height="342" fill="#0a0b0d"/>
<line x1="64" y1="1" x2="936" y2="1" stroke="#20242b"/>
<text x="936" y="16" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8a33d" opacity=".32" text-anchor="end" letter-spacing="-1">01</text>
<text x="64" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.8" fill="#5c584f" letter-spacing="1.9">WHAT IT LOOKS LIKE WHEN THE GATE HOLDS</text>
<text x="936" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.8" fill="#5c584f" letter-spacing="1.4" text-anchor="end">sample session</text>
<rect x="64" y="22" width="872" height="214" rx="5" fill="#e8a33d" fill-opacity=".025" stroke="#20242b"/>
<text x="86" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5c584f">$ claude</text>
<circle cx="90" cy="72" r="3.4" fill="#e8a33d"/>
<text x="102" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#e8a33d" font-weight="600">forge  one decision before the store layer</text>
<text x="86" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#eae7e2" font-weight="600">Q   how should sessions persist?</text>
<text x="86" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b867e">A   signed cookie      stateless, 4 KB cap, no revocation</text>
<text x="86" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b867e">B   redis session id   revocable, needs a Redis you run</text>
<text x="86" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b867e">C   database session   revocable, one more query per request</text>
<text x="86" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.8" fill="#f6cd85">recommend B if Redis already runs, otherwise C</text>
<path d="M87 203.6 l3.8 3.4 l-3.8 3.4" fill="none" stroke="#eae7e2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#eae7e2" font-weight="600">your call: C</text>
<path d="M86 228 l3.4 3.6 l6.6 -7.4" fill="none" stroke="#7fb069" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b867e">recorded   .claude/forge/0007-sessions.md</text>
<path d="M86 247 l3.4 3.6 l6.6 -7.4" fill="none" stroke="#7fb069" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b867e">gate open, writing code</text>
<line x1="64" y1="252" x2="936" y2="252" stroke="#20242b"/>
<text x="64" y="286" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eae7e2" letter-spacing="-.6">1,216</text>
<text x="64" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#5c584f" letter-spacing="1.5">TESTS</text>
<text x="282" y="286" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eae7e2" letter-spacing="-.6">100%</text>
