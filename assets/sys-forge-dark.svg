<text x="500" y="286" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eae7e2" letter-spacing="-.6">v1.28</text>
<text x="500" y="303" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#5c584f" letter-spacing="1.5">RELEASE</text>
<text x="718" y="286" font-family="Segoe UI, ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eae7e2" letter-spacing="-.6">MIT</text>
